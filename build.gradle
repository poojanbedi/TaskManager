import groovy.transform.CompileStatic

plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.pb'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter'
	runtimeOnly 'com.h2database:h2'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}

static def assertContains(String text, String expected, String label) {
    if (!text.contains(expected)) {
        throw new AssertionError("${label} is missing. Expected to find: ${expected}")
    }
}

static def assertFileExists(File file, String label) {
    if (!file.exists()) {
        throw new AssertionError("${label} does not exist: ${file.absolutePath}")
    }
}

static def testJavaToolchain(String content) {

    assertContains(content, "languageVersion = JavaLanguageVersion.of(21)", "Java 21 toolchain")
}

static def testRepositories(String content) {
    assertContains(content, "mavenCentral()", "Maven Central repository")
}

static def testCoreDependencies(String content) {
    assertContains(content, "spring-boot-starter-data-jpa", "Spring Data JPA starter dependency")
    assertContains(content, "spring-boot-starter-web", "Spring Web starter dependency")
    assertContains(content, "spring-boot-starter-validation", "Spring Validation starter dependency")
    assertContains(content, "spring-boot-starter", "Spring Boot starter dependency")
}

static def testH2Dependency(String content) {
    assertContains(content, "runtimeOnly 'com.h2database:h2'", "H2 runtime dependency")
}

static def testTestDependencies(String content) {
    assertContains(content, "spring-boot-starter-test", "Spring Boot test dependency")
    assertContains(content, "junit-platform-launcher", "JUnit platform launcher dependency")
}

static def testJUnitPlatformConfiguration(String content) {
    assertContains(content, "useJUnitPlatform()", "JUnit Platform configuration")
}

tasks.register("validateBuildGradleUnitTests") {
    group = "verification"
    description = "Validates the build.gradle settings for Java 21, Boot dependencies, H2, and JUnit configuration."

    def buildFile = file("build.gradle")

    doLast {
        assertFileExists(buildFile, "build.gradle")
        def content = buildFile.getText('UTF-8')

        testJavaToolchain(content)
        testRepositories(content)
        testCoreDependencies(content)
        testH2Dependency(content)
        testTestDependencies(content)
        testJUnitPlatformConfiguration(content)

        println "All build.gradle validation tests passed."
    }
}