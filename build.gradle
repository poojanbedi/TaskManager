import groovy.transform.CompileStatic

plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.pb'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter'
	runtimeOnly 'com.h2database:h2'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}

bootRun {
	environment 'UPLOAD_ROOT_DIR', System.getProperty("user.dir")
	environment 'UPLOAD_TARGET_DIR', "/uploads"
}

def assertContains(String text, String expected, String label) {
    if (!text.contains(expected)) {
        throw new AssertionError("${label} is missing. Expected to find: ${expected}")
    }
}

def assertFileExists(File file, String label) {
    if (!file.exists()) {
        throw new AssertionError("${label} does not exist: ${file.absolutePath}")
    }
}

def testJavaToolchain() {
    def buildFile = file("${projectDir}/build.gradle")
    assertFileExists(buildFile, "build.gradle")

    def content = buildFile.getText('UTF-8')
    assertContains(content, "languageVersion = JavaLanguageVersion.of(21)", "Java 21 toolchain")
}

def testRepositories() {
    def buildFile = file("${projectDir}/build.gradle")
    def content = buildFile.getText('UTF-8')
    assertContains(content, "mavenCentral()", "Maven Central repository")
}

def testCoreDependencies() {
    def buildFile = file("${projectDir}/build.gradle")
    def content = buildFile.getText('UTF-8')

    assertContains(content, "spring-boot-starter-data-jpa", "Spring Data JPA starter dependency")
    assertContains(content, "spring-boot-starter-web", "Spring Web starter dependency")
    assertContains(content, "spring-boot-starter-validation", "Spring Validation starter dependency")
    assertContains(content, "spring-boot-starter", "Spring Boot starter dependency")
}

def testH2Dependency() {
    def buildFile = file("${projectDir}/build.gradle")
    def content = buildFile.getText('UTF-8')

    assertContains(content, "runtimeOnly 'com.h2database:h2'", "H2 runtime dependency")
}

def testTestDependencies() {
    def buildFile = file("${projectDir}/build.gradle")
    def content = buildFile.getText('UTF-8')

    assertContains(content, "spring-boot-starter-test", "Spring Boot test dependency")
    assertContains(content, "junit-platform-launcher", "JUnit platform launcher dependency")
}

def testJUnitPlatformConfiguration() {
    def buildFile = file("${projectDir}/build.gradle")
    def content = buildFile.getText('UTF-8')

    assertContains(content, "useJUnitPlatform()", "JUnit Platform configuration")
}

tasks.register("validateBuildGradleUnitTests") {
    group = "verification"
    description = "Validates the build.gradle settings for Java 21, Boot dependencies, H2, and JUnit configuration."

    doLast {
        testJavaToolchain()
        testRepositories()
        testCoreDependencies()
        testH2Dependency()
        testTestDependencies()
        testJUnitPlatformConfiguration()

        println "All build.gradle validation tests passed."
    }
}